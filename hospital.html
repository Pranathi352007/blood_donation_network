<!DOCTYPE html>
<html>

<head>
    <title>Hospital Dashboard</title>
</head>

<body>

    <h1>Hospital Dashboard</h1>

    <h2>Blood Request</h2>

    <form>
        <label>Hospital Name:</label>
        <input type="text" placeholder="Enter hospital name">
        <br><br>

        <label>Blood Group:</label>
        <select>
            <option>-- Select Blood Group --</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>O+</option>
            <option>O-</option>
            <option>AB+</option>
            <option>AB-</option>
        </select>
        <br><br>

        <label>Units Required:</label>
        <input type="number" min="1">
        <br><br>

        <label>City:</label>
        <input type="text" placeholder="Enter city">
        <br><br>

        <button type="submit">Submit Blood Request</button>
    </form>

    <h2>Hospital Information</h2>
    <p>Use this page to manage blood requirements and requests.</p>

</body>

</html>
