<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donor Dashboard | Blood Donation Network</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-shell">
  <nav class="navbar">
    <a class="brand" href="home.html"><span class="brand-mark">♥</span> Blood Donation Network</a>
    <div class="toolbar"><button id="logout" class="btn btn-danger">Logout</button></div>
  </nav>

  <main class="dashboard">
    <div class="dashboard-header">
      <div><h1>Donor Dashboard</h1><p id="welcome">Loading your account...</p></div>
    </div>

    <section class="panel">
      <h2>My donor profile</h2>
      <p class="subtitle">Create or update the donor profile linked to your authenticated account.</p>
      <form id="donorForm">
        <div class="form-grid">
          <div class="field"><label for="name">Name</label><input id="name" required></div>
          <div class="field"><label for="bloodGroup">Blood group</label><select id="bloodGroup" required><option value="">Select</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></div>
          <div class="field"><label for="phone">Phone</label><input id="phone" required></div>
          <div class="field"><label for="city">City</label><input id="city" required></div>
          <div class="field"><label for="age">Age</label><input id="age" type="number" min="18" max="65" required></div>
          <div class="field"><label for="gender">Gender</label><select id="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div>
          <div class="field full"><label for="address">Address</label><input id="address" placeholder="Optional address"></div>
          <div class="field"><label for="lastDonationDate">Last donation date</label><input id="lastDonationDate" type="date"></div>
          <div class="field" style="justify-content:end"><label><input id="available" type="checkbox" checked style="width:auto;margin-right:8px">Available for donation</label></div>
        </div>
        <div class="form-actions"><button id="saveButton" class="btn btn-primary" type="submit">Create profile</button><button id="deleteButton" class="btn btn-danger" type="button" hidden>Delete profile</button></div>
      </form>
      <p id="message" class="message"></p>
    </section>

    <section class="panel">
      <div class="dashboard-header"><div><h2>Donor directory</h2><p>Public donor profiles currently available through the API.</p></div><button id="loadDonors" class="btn btn-secondary">Refresh donors</button></div>
      <div id="donorList" class="donor-grid"><div class="empty">Click Refresh donors to load the directory.</div></div>
    </section>
  </main>

  <script>
    const API = "http://localhost:5001/api/donors";
    const token = localStorage.getItem("token");
    const user = JSON.parse(localStorage.getItem("user") || "null");
    const form = document.getElementById("donorForm");
    const message = document.getElementById("message");
    let currentDonorId = null;

    if (!token || !user) window.location.href = "DonarLogin.html";
    else document.getElementById("welcome").textContent = `Welcome, ${user.name}. Your profile is linked to your authenticated donor account.`;

    const authHeaders = () => ({ "Content-Type": "application/json", "Authorization": `Bearer ${token}` });
    const value = id => document.getElementById(id).value.trim();
    const setMessage = (text, type = "") => { message.className = `message ${type}`; message.textContent = text; };

    function fillForm(donor) {
      currentDonorId = donor._id;
      document.getElementById("name").value = donor.name || "";
      document.getElementById("bloodGroup").value = donor.bloodGroup || "";
      document.getElementById("phone").value = donor.phone || "";
      document.getElementById("city").value = donor.city || "";
      document.getElementById("age").value = donor.age ?? "";
      document.getElementById("gender").value = donor.gender || "";
      document.getElementById("address").value = donor.address || "";
      document.getElementById("available").checked = donor.available !== false;
      if (donor.lastDonationDate) document.getElementById("lastDonationDate").value = new Date(donor.lastDonationDate).toISOString().slice(0,10);
      document.getElementById("saveButton").textContent = "Update profile";
      document.getElementById("deleteButton").hidden = false;
    }

    async function loadMyProfile() {
      try {
        const response = await fetch(API);
        const data = await response.json();
        if (response.ok && data.success) {
          const donor = data.donors.find(d => String(d.userId) === String(user.id));
          if (donor) fillForm(donor);
        }
      } catch (error) { console.error(error); }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      setMessage(currentDonorId ? "Updating profile..." : "Creating profile...");
      const payload = {
        name: value("name"), bloodGroup: value("bloodGroup"), phone: value("phone"), city: value("city"),
        age: Number(value("age")), gender: value("gender") || undefined, address: value("address"),
        lastDonationDate: value("lastDonationDate") || undefined, available: document.getElementById("available").checked
      };
      try {
        const response = await fetch(currentDonorId ? `${API}/${currentDonorId}` : API, {
          method: currentDonorId ? "PUT" : "POST", headers: authHeaders(), body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (response.ok && data.success) {
          fillForm(data.donor);
          setMessage(data.message, "success");
          loadDonors();
        } else setMessage(data.message || "Request failed", "error");
      } catch (error) { console.error(error); setMessage("Unable to connect to the server.", "error"); }
    });

    async function loadDonors() {
      const list = document.getElementById("donorList");
      list.innerHTML = "<div class='empty'>Loading donors...</div>";
      try {
        const response = await fetch(API);
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.message || "Unable to load donors");
        if (!data.donors.length) { list.innerHTML = "<div class='empty'>No donors found.</div>"; return; }
        list.innerHTML = data.donors.map(d => `<article class="donor-card"><h3>${escapeHtml(d.name)}</h3><p><strong>Blood:</strong> ${escapeHtml(d.bloodGroup)}</p><p><strong>City:</strong> ${escapeHtml(d.city)}</p><p><strong>Phone:</strong> ${escapeHtml(d.phone)}</p><p><strong>Age:</strong> ${d.age}</p><p><span class="badge ${d.available ? "" : "off"}">${d.available ? "Available" : "Not available"}</span></p></article>`).join("");
      } catch (error) { console.error(error); list.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`; }
    }

    function escapeHtml(v) { return String(v ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;"); }

    document.getElementById("loadDonors").addEventListener("click", loadDonors);
    document.getElementById("deleteButton").addEventListener("click", async () => {
      if (!currentDonorId || !confirm("Delete your donor profile?")) return;
      try {
        const response = await fetch(`${API}/${currentDonorId}`, { method: "DELETE", headers: authHeaders() });
        const data = await response.json();
        if (response.ok && data.success) {
          currentDonorId = null; form.reset(); document.getElementById("available").checked = true;
          document.getElementById("saveButton").textContent = "Create profile"; document.getElementById("deleteButton").hidden = true;
          setMessage(data.message, "success"); loadDonors();
        } else setMessage(data.message || "Delete failed", "error");
      } catch (error) { setMessage("Unable to connect to the server.", "error"); }
    });

    document.getElementById("logout").addEventListener("click", () => { localStorage.removeItem("token"); localStorage.removeItem("user"); window.location.href = "DonarLogin.html"; });
    loadMyProfile();
  </script>
</body>
</html>
