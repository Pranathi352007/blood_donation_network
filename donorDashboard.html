<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Dashboard</title>
    <link rel="stylesheet" href="donorDashboard.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Donor Dashboard</h1>
            <p id="welcome"></p>
        </div>

        <div class="card">
            <h2>Create Donor Profile</h2>
            <form id="donorForm">
                <div class="form-grid">
                    <div class="field">
                        <label for="name">Name:</label>
                        <input type="text" id="name" required>
                    </div>

                    <div class="field">
                        <label for="bloodGroup">Blood Group:</label>
                        <select id="bloodGroup" required>
                            <option value="">Select</option>
                            <option>A+</option><option>A-</option>
                            <option>B+</option><option>B-</option>
                            <option>AB+</option><option>AB-</option>
                            <option>O+</option><option>O-</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="phone">Phone:</label>
                        <input type="tel" id="phone" required>
                    </div>

                    <div class="field">
                        <label for="city">City:</label>
                        <input type="text" id="city" required>
                    </div>

                    <div class="field">
                        <label for="age">Age:</label>
                        <input type="number" id="age" min="18" max="65" required>
                    </div>

                    <div class="field">
                        <label for="gender">Gender:</label>
                        <select id="gender">
                            <option value="">Select</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="field full">
                        <label for="address">Address:</label>
                        <input type="text" id="address">
                    </div>

                    <div class="field full checkbox-field">
                        <input type="checkbox" id="available" checked>
                        <label for="available">Available for donation</label>
                    </div>
                </div>

                <div class="actions">
                    <button type="submit">Create Donor Profile</button>
                </div>
            </form>

            <p id="message"></p>
        </div>

        <div class="card">
            <h2>Donor List</h2>
            <button id="loadDonors">View Donors</button>
            <div id="donorList" class="donor-grid"></div>
        </div>

        <div class="card">
            <button id="logout" class="secondary-button">Logout</button>
        </div>
    </div>

    <script>
        const API = "http://localhost:5001/api/donors";
        const token = localStorage.getItem("token");
        const user = JSON.parse(localStorage.getItem("user") || "null");
        const message = document.getElementById("message");

        if (!token || !user) {
            window.location.href = "DonarLogin.html";
        } else {
            document.getElementById("welcome").textContent =
                "Welcome, " + user.name + "!";
        }

        function authHeaders() {
            return {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            };
        }

        document.getElementById("donorForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            message.textContent = "Creating donor profile...";

            try {
                const response = await fetch(API, {
                    method: "POST",
                    headers: authHeaders(),
                    body: JSON.stringify({
                        name: document.getElementById("name").value.trim(),
                        bloodGroup: document.getElementById("bloodGroup").value,
                        phone: document.getElementById("phone").value.trim(),
                        city: document.getElementById("city").value.trim(),
                        age: Number(document.getElementById("age").value),
                        gender: document.getElementById("gender").value || undefined,
                        address: document.getElementById("address").value.trim(),
                        available: document.getElementById("available").checked
                    })
                });

                const data = await response.json();
                message.textContent = data.message || "Request completed";

                if (response.ok && data.success) {
                    document.getElementById("donorForm").reset();
                    document.getElementById("available").checked = true;
                    loadDonors();
                }
            } catch (error) {
                console.error(error);
                message.textContent = "Unable to connect to the server.";
            }
        });

        async function loadDonors() {
            const list = document.getElementById("donorList");
            list.textContent = "Loading donors...";

            try {
                const response = await fetch(API);
                const data = await response.json();

                if (!response.ok || !data.success) {
                    list.textContent = data.message || "Unable to load donors.";
                    return;
                }

                if (data.donors.length === 0) {
                    list.textContent = "No donors found.";
                    return;
                }

                list.innerHTML = data.donors.map(donor => `
                    <div class="donor-card">
                        <h3>${escapeHtml(donor.name)}</h3>
                        <p><strong>Blood Group:</strong> ${escapeHtml(donor.bloodGroup)}</p>
                        <p><strong>City:</strong> ${escapeHtml(donor.city)}</p>
                        <p><strong>Phone:</strong> ${escapeHtml(donor.phone)}</p>
                        <p><strong>Age:</strong> ${donor.age}</p>
                        <p><span class="badge">${donor.available ? "Available" : "Not Available"}</span></p>
                    </div>
                `).join("");
            } catch (error) {
                console.error(error);
                list.textContent = "Unable to connect to the server.";
            }
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        document.getElementById("loadDonors").addEventListener("click", loadDonors);

        document.getElementById("logout").addEventListener("click", function () {
            localStorage.removeItem("token");
            localStorage.removeItem("user");
            window.location.href = "DonarLogin.html";
        });
    </script>
</body>
</html>
