<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donor Login | Blood Donation Network</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-page">
    <section class="auth-visual">
      <a class="brand" href="home.html"><span class="brand-mark">♥</span> Blood Donation Network</a>
      <div>
        <div class="eyebrow">Donor access</div>
        <h1>Welcome back, donor.</h1>
        <p>Sign in to manage your donor profile, update your availability and discover the donor network.</p>
      </div>
    </section>
    <section class="auth-form-wrap">
      <div class="auth-card">
        <h2>Donor Login</h2>
        <p class="subtitle">Enter your registered email and password.</p>
        <form id="loginForm">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>
          <div class="field" style="margin-top:16px">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
          </div>
          <div class="form-actions"><button class="btn btn-primary" type="submit">Login</button></div>
        </form>
        <p id="message" class="message"></p>
        <div class="auth-footer">Don't have an account? <a href="Register.html">Create one</a></div>
      </div>
    </section>
  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.className = "message";
      message.textContent = "Signing in...";
      try {
        const response = await fetch("http://localhost:5001/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value
          })
        });
        const data = await response.json();
        if (response.ok && data.success) {
          localStorage.setItem("token", data.token);
          localStorage.setItem("user", JSON.stringify(data.user));
          if (data.user.role === "donor") {
            window.location.href = "donorDashboard.html";
          } else {
            message.className = "message error";
            message.textContent = "This page is for donor accounts.";
          }
        } else {
          message.className = "message error";
          message.textContent = data.message || "Login failed";
        }
      } catch (error) {
        console.error(error);
        message.className = "message error";
        message.textContent = "Unable to connect to the server.";
      }
    });
  </script>
</body>
</html>
