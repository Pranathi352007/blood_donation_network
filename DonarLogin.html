<!DOCTYPE html>
<html>
    <body>
        <form>
            Name:<input type="text" placeholder="eg:name" required><br>
            Phone Number:<input type="number" placeholder="eg:1234567893" required><br>
            Address:<textarea></textarea><br>
            Age:<input type="number"><br>
            Gender:
            <label>
                <input type="radio" name="gender" value="male">
                Male
            </label>
            <label>
                <input type="radio" name="gender" value="female">
                Female
            </label>
            <label>
            <input type="radio" name="gender" value="others">
            Others
            </label>
            Blood Group:
           <select>
            <option>----Select Group----</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>O+</option>
            <option>O-</option>
            <option>AB+</option>
            <option>AB-</option>
           </select>
        </form>
    </body>
</html>
